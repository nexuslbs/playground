  <ellipse cx="50" cy="48" rx="28" ry="24" fill="#4ade80"/>
  <!-- Eyes -->
  <ellipse cx="36" cy="38" rx="6" ry="7" fill="white"/>
  <ellipse cx="64" cy="38" rx="6" ry="7" fill="white"/>
  <ellipse cx="37" cy="37" rx="3.5" ry="4" fill="#1a1a2e"/>
  <ellipse cx="63" cy="37" rx="3.5" ry="4" fill="#1a1a2e"/>
  <!-- Tongue -->
  <line x1="50" y1="64" x2="50" y2="78" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="78" x2="42" y2="86" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="78" x2="58" y2="86" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Grid pattern hint -->
  <rect x="28" y="48" width="10" height="10" fill="#22c55e" rx="2" opacity="0.4"/>
  <rect x="38" y="58" width="10" height="10" fill="#22c55e" rx="2" opacity="0.3"/>
  <rect x="48" y="68" width="10" height="10" fill="#22c55e" rx="2" opacity="0.2"/>
