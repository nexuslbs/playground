services:
  db:
    image: postgres:16
    container_name: movie-db-db
    environment:
      POSTGRES_DB: movie_db
      POSTGRES_USER: movie_user
      POSTGRES_PASSWORD: movie_pass
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movie_user -d movie_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: movie-db-backend
    # Host port 8080 is occupied by sandbox infrastructure (omniagent).
    # Publish the backend on host port 8081 instead; the container itself
    # still listens on 8080 internally.
    ports:
      - "8081:8080"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: movie_user
      DB_PASSWORD: movie_pass
      DB_NAME: movie_db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: movie-db-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  dbdata:
